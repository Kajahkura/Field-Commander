[package]
name = "field-commander-operations"
version = "1.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[features]
default = ["native-db"]
native-db = []

[dependencies]
blinkhost-sdk = { path = "vendor/blinkhost-sdk", version = "=1.1.0" }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
